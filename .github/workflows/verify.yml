name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec tsc -p tsconfig.client.json --noEmit
      - run: pnpm run test
      - run: pnpm pack --pack-destination ./dist
      - run: node scripts/verify-package.mjs ./dist/dsh-missher-evolution-0.7.0.tgz
